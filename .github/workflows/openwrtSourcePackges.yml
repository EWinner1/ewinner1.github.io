name: Build & Deploy OpenWrt Package Repository

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构 (aarch64 / x86_64 / arm_cortex-a9 等)'
        required: false
        default: 'aarch64'
        type: string
      openwrt_branch:
        description: 'OpenWrt 分支版本 (用于索引描述)'
        required: false
        default: '25.12.5'
        type: string

env:
  OPENWRT_ARCH: ${{ inputs.arch || 'aarch64' }}
  OPENWRT_BRANCH: ${{ inputs.openwrt_branch || '25.12.5' }}
  PACKAGES_DIR: packages
  # 与脚本一致，复制到 source/resource 目录
  SOURCE_PACKAGES_DIR: source/resource
  # OpenWrt apk Makefile URL (用于动态获取 PKG_VERSION)
  OPENWRT_APK_MAKEFILE_URL: "https://raw.githubusercontent.com/openwrt/openwrt/main/package/system/apk/Makefile"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.ACTION_SSH_PRIVATE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ─── 准备签名密钥 ───
      - name: Prepare signing key
        env:
          OPENWRT_PACKAGE_KEY: ${{ secrets.OPENWRT_PACKAGE }}
        run: |
          echo "🔐 准备签名密钥..."
          
          # 创建临时目录存储密钥
          mkdir -p /tmp/apk-keys
          
          # 将私钥写入 .sec 文件
          echo "${OPENWRT_PACKAGE_KEY}" > /tmp/apk-keys/apk.sec
          
          # 验证密钥文件
          if [ ! -s /tmp/apk-keys/apk.sec ]; then
            echo "::error::签名密钥文件为空，请检查 secrets.OPENWRT_PACKAGE 配置"
            exit 1
          fi
          
          echo "✅ 签名密钥准备完成"
          echo "密钥文件: /tmp/apk-keys/apk.sec"

      # ─── 从 GitHub Releases 下载 APK 软件包 ───
      - name: Download APK packages from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  OpenWrt APK 软件包下载器 (GitHub Releases)"
          echo "═══════════════════════════════════════════════"
          echo "  目标架构: ${{ env.OPENWRT_ARCH }}"
          echo "  OpenWrt:  ${{ env.OPENWRT_BRANCH }}"
          echo "═══════════════════════════════════════════════"

          mkdir -p ${{ env.PACKAGES_DIR }}
          cd ${{ env.PACKAGES_DIR }}

          # ── 定义下载源和目标包 ──
          # 格式: "仓库地址" -> "包名1 包名2 ..."
          declare -A REPO_MAP=(
            ["vernesong/OpenClash"]="luci-app-openclash"
            ["jerrykuku/luci-theme-argon"]="luci-app-argon-config luci-i18n-argon-config-zh-cn luci-theme-argon"
          )

          TOTAL_SUCCESS=0
          TOTAL_FAIL=0
          FAILED_PACKAGES=""

          for REPO in "${!REPO_MAP[@]}"; do
            echo ""
            echo "──────────────────────────────────────────"
            echo "📦 仓库: ${REPO}"
            echo "   目标包: ${REPO_MAP[$REPO]}"
            echo "──────────────────────────────────────────"

            # 获取最新 release 的 tag
            LATEST_TAG=$(gh release view --repo "${REPO}" --json tagName -q '.tagName' 2>/dev/null)
            if [ -z "${LATEST_TAG}" ]; then
              echo "  ⚠️  无法获取 ${REPO} 的最新 release，尝试列出最近的 release..."
              LATEST_TAG=$(gh release list --repo "${REPO}" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            fi
            if [ -z "${LATEST_TAG}" ]; then
              echo "  ⚠️  仍然无法获取 ${REPO} 的 release tag，跳过"
              TOTAL_FAIL=$((TOTAL_FAIL + 1))
              FAILED_PACKAGES="${FAILED_PACKAGES} ${REPO}(获取版本失败)"
              continue
            fi
            echo "  📌 最新版本: ${LATEST_TAG}"

            # 列出该 release 的所有资产文件名
            ASSETS=$(gh release view "${LATEST_TAG}" --repo "${REPO}" --json assets -q '.assets[].name' 2>/dev/null || true)
            
            # 调试：资产列表为空时输出详细信息
            if [ -z "${ASSETS}" ]; then
              echo "  ⚠️  未检索到资产列表，尝试获取 release 详情..."
              gh release view "${LATEST_TAG}" --repo "${REPO}" || true
            fi

            # 对每个目标包，从资产列表中匹配 APK 文件并下载
            for PKG in ${REPO_MAP[$REPO]}; do
              echo ""
              echo "  🔍 查找 ${PKG} 的 APK..."

              # 优先匹配: 包名开头 + 当前架构 + .apk
              # 备选匹配: 包名开头 + all (通用架构) + .apk
              # 兜底匹配: 包名开头 + .apk (任意)
              MATCHED=$(echo "${ASSETS}" | grep -i "^${PKG}.*${{ env.OPENWRT_ARCH }}.*\.apk$" | head -1 || true)
              if [ -z "${MATCHED}" ]; then
                MATCHED=$(echo "${ASSETS}" | grep -i "^${PKG}.*all.*\.apk$" | head -1 || true)
              fi
              if [ -z "${MATCHED}" ]; then
                MATCHED=$(echo "${ASSETS}" | grep -i "^${PKG}.*\.apk$" | head -1 || true)
              fi

              if [ -z "${MATCHED}" ]; then
                echo "  ⚠️  未找到 ${PKG} 的 APK 文件 (跳过 .ipk 格式)"
                TOTAL_FAIL=$((TOTAL_FAIL + 1))
                FAILED_PACKAGES="${FAILED_PACKAGES} ${PKG}(未找到)"
                continue
              fi

              FILENAME="${MATCHED}"
              echo "  📥 下载: ${FILENAME}"

              if gh release download "${LATEST_TAG}" \
                --repo "${REPO}" \
                --pattern "${FILENAME}" \
                --dir . \
                --clobber 2>&1; then
                echo "  ✅ ${PKG} 下载成功"
                TOTAL_SUCCESS=$((TOTAL_SUCCESS + 1))
              else
                echo "  ❌ ${PKG} 下载失败"
                TOTAL_FAIL=$((TOTAL_FAIL + 1))
                FAILED_PACKAGES="${FAILED_PACKAGES} ${PKG}(下载失败)"
              fi
            done
          done

          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  📊 下载汇总"
          echo "═══════════════════════════════════════════════"
          echo "  成功: ${TOTAL_SUCCESS}  失败: ${TOTAL_FAIL}"
          
          if [ -n "${FAILED_PACKAGES}" ]; then
            echo ""
            echo "  ⚠️  失败的包:${FAILED_PACKAGES}"
          fi
          
          echo ""
          echo "  已下载的 APK 文件:"
          ls -lh *.apk 2>/dev/null || echo "  (无)"
          echo "═══════════════════════════════════════════════"
          
          # 如果全部失败则报错
          if [ "${TOTAL_SUCCESS}" -eq 0 ] && [ "${TOTAL_FAIL}" -gt 0 ]; then
            echo "::error::所有软件包下载失败"
            exit 1
          fi

      # ─── 动态获取 PKG_VERSION 并下载 apk.static ───
      - name: Download apk.static
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  apk.static 下载器"
          echo "═══════════════════════════════════════════════"
          
          # 从 OpenWrt 仓库动态获取 PKG_VERSION
          echo "🔍 从 OpenWrt 仓库读取 PKG_VERSION..."
          APK_VERSION=$(curl -fsSL "${{ env.OPENWRT_APK_MAKEFILE_URL }}" \
            | grep -m1 '^PKG_VERSION' \
            | sed 's/^PKG_VERSION\s*[:?]*=\s*//' \
            | tr -d '[:space:]')
          
          if [ -z "${APK_VERSION}" ]; then
            echo "::error::无法从 OpenWrt 仓库读取 PKG_VERSION"
            exit 1
          fi
          
          echo "✅ PKG_VERSION: ${APK_VERSION}"
          echo "APK_VERSION=${APK_VERSION}" >> $GITHUB_ENV
          
          # 构建下载 URL
          APK_STATIC_URL="https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v${APK_VERSION}/x86_64/apk.static"
          echo "📥 下载地址: ${APK_STATIC_URL}"
          
          # 下载 apk.static
          cd "${{ env.PACKAGES_DIR }}"
          if ! wget -q --show-progress -O apk.static "${APK_STATIC_URL}"; then
            echo "::error::下载 apk.static 失败"
            exit 1
          fi
          
          chmod +x apk.static
          echo ""
          echo "✅ apk.static 下载完成"
          ls -lh apk.static

      # ─── 生成签名索引 (packages.adb) ───
      - name: Generate signed repository index
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  签名索引生成器"
          echo "═══════════════════════════════════════════════"
          
          cd "${{ env.PACKAGES_DIR }}"
          
          # 检查 APK 文件数量
          APK_COUNT=$(find . -maxdepth 1 -name "*.apk" -not -name "apk.static" | wc -l)
          echo "📦 找到 ${APK_COUNT} 个软件包"
          
          if [ "${APK_COUNT}" -eq 0 ]; then
            echo "::warning::没有找到任何 .apk 文件，跳过索引生成"
            exit 0
          fi
          
          # 使用 apk.static 生成签名索引
          echo "🔐 使用私钥签名生成 packages.adb..."
          echo "密钥文件: /tmp/apk-keys/apk.sec"
          
          if ! ./apk.static mkndx \
            --allow-untrusted \
            --sign /tmp/apk-keys/apk.sec \
            --output packages.adb \
            *.apk; then
            echo "::error::生成签名索引失败"
            exit 1
          fi
          
          echo ""
          echo "✅ 签名索引生成完成"
          ls -lh packages.adb
          
          # 显示索引信息
          echo ""
          echo "📋 索引内容:"
          ./apk.static mkndx --info packages.adb 2>/dev/null || true

      # ─── 复制文件到静态资源目录 ───
      - name: Copy files to static resources
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  文件复制"
          echo "═══════════════════════════════════════════════"
          
          # 创建目标目录
          mkdir -p "${{ env.SOURCE_PACKAGES_DIR }}"
          
          cd "${{ env.PACKAGES_DIR }}"
          
          # 复制 APK 包文件
          echo "📦 复制 APK 包文件..."
          APK_FILES=$(find . -maxdepth 1 -name "*.apk" -not -name "apk.static" 2>/dev/null)
          if [ -n "${APK_FILES}" ]; then
            cp -v *.apk "${{ github.workspace }}/${{ env.SOURCE_PACKAGES_DIR }}/" 2>/dev/null || true
            # 排除 apk.static
            rm -f "${{ github.workspace }}/${{ env.SOURCE_PACKAGES_DIR }}/apk.static" 2>/dev/null || true
          fi
          
          # 复制签名索引文件
          echo ""
          echo "📋 复制签名索引文件..."
          if [ -f "packages.adb" ]; then
            cp -v packages.adb "${{ github.workspace }}/${{ env.SOURCE_PACKAGES_DIR }}/"
          fi
          
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "✅ 文件复制完成"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "📁 目标目录内容:"
          ls -lh "${{ github.workspace }}/${{ env.SOURCE_PACKAGES_DIR }}/"
          
          # 统计信息
          FINAL_APK_COUNT=$(find "${{ github.workspace }}/${{ env.SOURCE_PACKAGES_DIR }}" -maxdepth 1 -name "*.apk" | wc -l)
          echo ""
          echo "📊 最终统计: ${FINAL_APK_COUNT} 个软件包 + 签名索引"
          echo "ℹ️  公钥文件已存在于 source/resource 目录，无需复制"

      # ─── 配置 Git 和 SSH ───
      - name: Configure Git & SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ACTION_SSH_PRIVATE }}
        run: |
          # 配置 git 用户信息
          git config --global user.email "ewinner.super@qq.com"
          git config --global user.name "ewinner"
          echo "✅ Git user configured"

          # 配置 SSH 私钥
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 添加 GitHub 到 known_hosts
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH key configured"

      # ─── 更新 OpenwrtPackage.md 中的链接 ───
      - name: Update OpenwrtPackage.md links
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  更新文章链接"
          echo "═══════════════════════════════════════════════"

          POST_FILE="source/_posts/OpenwrtPackage.md"
          RES_DIR="${{ env.SOURCE_PACKAGES_DIR }}"

          # 动态查找各包的实际文件名
          OPENCLASH_FILE=$(find "${RES_DIR}" -maxdepth 1 -name "luci-app-openclash*.apk" -printf "%f" | head -1)
          THEME_FILE=$(find "${RES_DIR}" -maxdepth 1 -name "luci-theme-argon*.apk" -not -name "luci-app*" -printf "%f" | head -1)
          ARGON_CONFIG_FILE=$(find "${RES_DIR}" -maxdepth 1 -name "luci-app-argon-config*.apk" -printf "%f" | head -1)
          I18N_FILE=$(find "${RES_DIR}" -maxdepth 1 -name "luci-i18n-argon-config*.apk" -printf "%f" | head -1)

          echo "  luci-app-openclash:       ${OPENCLASH_FILE:-未找到}"
          echo "  luci-theme-argon:         ${THEME_FILE:-未找到}"
          echo "  luci-app-argon-config:    ${ARGON_CONFIG_FILE:-未找到}"
          echo "  luci-i18n-argon-config:   ${I18N_FILE:-未找到}"

          # 替换 Index 部分的链接
          INDEX_LINE=$(grep -n "^# Index$" "${POST_FILE}" | head -1 | cut -d: -f1)
          if [ -n "${INDEX_LINE}" ]; then
            # 保留 # Index 之前的内容，重新生成 Index 部分
            head -n "${INDEX_LINE}" "${POST_FILE}" > /tmp/post_tmp.md
            {
              echo "# Index"
              [ -n "${OPENCLASH_FILE}" ]     && echo "- [luci-app-openclash](/resource/${OPENCLASH_FILE})"
              [ -n "${THEME_FILE}" ]         && echo "- [luci-theme-argon](/resource/${THEME_FILE})"
              [ -n "${ARGON_CONFIG_FILE}" ]  && echo "- [luci-app-argon-config](/resource/${ARGON_CONFIG_FILE})"
              [ -n "${I18N_FILE}" ]          && echo "- [luci-i18n-argon-config-zh-cn](/resource/${I18N_FILE})"
            } >> /tmp/post_tmp.md
            mv /tmp/post_tmp.md "${POST_FILE}"
            echo ""
            echo "✅ 已更新 ${POST_FILE}"
            echo ""
            echo "📋 更新后的内容:"
            sed -n '/^# Index$/,$p' "${POST_FILE}"
          else
            echo "⚠️  未找到 # Index 标题，跳过更新"
          fi

      # ─── 提交链接更新到 main 分支 ───
      - name: Commit link updates to main
        run: |
          git add source/_posts/OpenwrtPackage.md source/resource/

          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "ℹ️  没有变更需要提交"
          else
            git commit -m "chore: update OpenWrt packages and links [skip ci]"
            git push origin main
            echo "✅ 已提交并推送到 main 分支"
          fi

      # ─── 构建并部署 GitHub Pages ───
      - name: Install npm dependencies
        run: npm ci

      - name: Clean, Generate & Deploy
        run: npm run onetap

      # ─── 清理敏感文件 ───
      - name: Cleanup sensitive files
        if: always()
        run: |
          echo "🧹 清理敏感文件..."
          rm -rf /tmp/apk-keys 2>/dev/null || true
          rm -f "${{ env.PACKAGES_DIR }}/apk.static" 2>/dev/null || true
          rm -f ~/.ssh/id_ed25519 2>/dev/null || true
          echo "✅ 清理完成"
